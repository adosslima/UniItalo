<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body bgcolor="white">
    <h1>
        <p align="center">
            Tabelas na Página HTML.
        </p>
    </h1>
    <br>
    <!-- Estas são as tags para inserir tabelas nas páginas HTML -->
    <!-- Início da Tabela -->
    <table>
        <!-- Início da primeira linha -->
        <tr>
            <td>O texto da primeira célula</td>
            <td>O texto da segunda célula</td>
        </tr>
        <!-- Fim da primeira linha -->
        <tr>
            <td>O texto da primeira célula da Segunda Linha</td>
            <td>O texto da segunda célula da Segunda Linha</td>
        </tr>
    </table>
    <p></p>
    <br>
    <br>
</body>
</html>
